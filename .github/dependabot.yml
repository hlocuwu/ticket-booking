version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /src/services/auth
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, go]
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: /src/services/booking
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, go]
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: /src/services/event
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, go]
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: /src/services/inventory
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, go]
    open-pull-requests-limit: 3

  - package-ecosystem: gomod
    directory: /src/services/waitingroom
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, go]
    open-pull-requests-limit: 3

  # npm — frontend
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, javascript]
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: [react, react-*, "@types/react*"]
      vite:
        patterns: [vite, "@vitejs/*", "@tailwindcss/*", tailwindcss, postcss]

  # npm — payment service
  - package-ecosystem: npm
    directory: /src/services/payment
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, javascript]
    open-pull-requests-limit: 3

  # pip — notification service
  - package-ecosystem: pip
    directory: /src/services/notification
    schedule:
      interval: weekly
      day: wednesday
      time: "09:00"
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, python]
    open-pull-requests-limit: 3
