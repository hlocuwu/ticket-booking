name: Python CI

on:
  workflow_call:

jobs:
  notification:
    name: Notification Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/services/notification

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: src/services/notification/requirements.txt

      - name: Install dependencies
        run: |
          pip install ruff mypy pytest pytest-cov
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check . --line-length 120

      - name: Type check (mypy)
        run: mypy main.py --ignore-missing-imports

      - name: Test with coverage
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=60
