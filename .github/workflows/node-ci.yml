name: Node.js CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "services/payment/**"
      - ".github/workflows/node-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "services/payment/**"
      - ".github/workflows/node-ci.yml"

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  payment:
    name: Payment Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/payment/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
