name: Docker CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "services/**"
      - "frontend/**"
      - ".github/workflows/docker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - ".github/workflows/docker-ci.yml"

jobs:
  # Detect which services have changed to avoid rebuilding everything.
  # On a version tag (v*.*.*), always build all services for a full release.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          filters: |
            auth:
              - 'services/auth/**'
            booking:
              - 'services/booking/**'
            event:
              - 'services/event/**'
            inventory:
              - 'services/inventory/**'
            notification:
              - 'services/notification/**'
            payment:
              - 'services/payment/**'
            waitingroom:
              - 'services/waitingroom/**'
            frontend:
              - 'frontend/**'

      - name: Set services list
        id: set
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo 'services=["auth","booking","event","inventory","notification","payment","waitingroom","frontend"]' >> $GITHUB_OUTPUT
          else
            echo 'services=${{ steps.filter.outputs.changes }}' >> $GITHUB_OUTPUT
          fi

  build-scan-push:
    needs: changes
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR
      security-events: write # upload Trivy SARIF
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Resolve build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "path=./frontend" >> $GITHUB_OUTPUT
          else
            echo "path=./services/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ticket-booking-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload scan results to GitHub Security tab
        if: always() && steps.trivy.outcome != 'skipped' && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Push to GHCR
        if: github.event_name == 'push'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
