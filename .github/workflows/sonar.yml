name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for blame info and accurate new-code detection

      # --- Go coverage ---
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/auth/go.mod

      - name: Go coverage (all services)
        run: |
          for svc in auth booking event inventory waitingroom; do
            cd services/$svc
            go test -coverprofile=coverage.out ./... 2>/dev/null || true
            cd ../..
          done

      # --- Python coverage ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/notification/requirements.txt

      - name: Python coverage (notification)
        working-directory: services/notification
        run: |
          pip install pytest pytest-cov flask gunicorn -q
          pip install -r requirements.txt -q
          pytest tests/ --cov=. --cov-report=xml -q 2>/dev/null || true

      # --- JavaScript/Frontend coverage ---
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend coverage
        working-directory: frontend
        run: |
          npm ci -q
          npm test 2>/dev/null || true

      - name: Payment coverage
        working-directory: services/payment
        run: |
          npm ci -q
          npm test 2>/dev/null || true

      # --- SonarCloud scan ---
      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
