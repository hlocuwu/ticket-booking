name: Go CI

on:
  workflow_call:

jobs:
  lint-and-build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [auth, booking, event, inventory, waitingroom]
    defaults:
      run:
        working-directory: src/services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/services/${{ matrix.service }}/go.mod
          cache-dependency-path: src/services/${{ matrix.service }}/go.sum

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ matrix.service }}-${{ hashFiles(format('src/services/{0}/go.sum', matrix.service)) }}
          restore-keys: go-build-${{ matrix.service }}-

      - name: Sync dependencies
        run: go mod tidy

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --config ../../.golangci.yml ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
