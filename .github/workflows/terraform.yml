name: Terraform CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'infra/terraform/**'
  pull_request:
    branches: [main, staging]
    paths:
      - 'infra/terraform/**'

jobs:
  terraform:
    name: Lint & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: |
          tflint --init
          tflint --recursive

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: true

      - name: Terraform Plan
        if: github.event_name == 'pull_request' && secrets.GCP_SA_KEY != ''
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: |
          terraform init
          terraform plan -no-color -input=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="db_password=placeholder" \
            -var="jwt_secret=placeholder" \
            -var="ghcr_token=placeholder" \
            2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && secrets.GCP_SA_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '```terraform\n' + plan.slice(0, 60000) + '\n```'
            });
