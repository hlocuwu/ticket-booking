name: CI

on:
  push:
    branches: [main, staging]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, staging]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      node: ${{ steps.filter.outputs.node }}
      python: ${{ steps.filter.outputs.python }}
      docker_services: ${{ steps.docker_services.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          filters: |
            go:
              - 'src/services/auth/**'
              - 'src/services/booking/**'
              - 'src/services/event/**'
              - 'src/services/inventory/**'
              - 'src/services/waitingroom/**'
              - '.github/workflows/template-go.yml'
            node:
              - 'src/frontend/**'
              - 'src/services/payment/**'
              - '.github/workflows/template-node.yml'
            python:
              - 'src/services/notification/**'
              - '.github/workflows/template-python.yml'
            auth:
              - 'src/services/auth/**'
            booking:
              - 'src/services/booking/**'
            event:
              - 'src/services/event/**'
            inventory:
              - 'src/services/inventory/**'
            notification:
              - 'src/services/notification/**'
            payment:
              - 'src/services/payment/**'
            waitingroom:
              - 'src/services/waitingroom/**'
            frontend:
              - 'src/frontend/**'

      - name: Set docker services
        id: docker_services
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo 'services=["auth","booking","event","inventory","notification","payment","waitingroom","frontend"]' >> $GITHUB_OUTPUT
          else
            SVCS=()
            [[ "${{ steps.filter.outputs.auth }}"        == "true" ]] && SVCS+=("auth")
            [[ "${{ steps.filter.outputs.booking }}"     == "true" ]] && SVCS+=("booking")
            [[ "${{ steps.filter.outputs.event }}"       == "true" ]] && SVCS+=("event")
            [[ "${{ steps.filter.outputs.inventory }}"   == "true" ]] && SVCS+=("inventory")
            [[ "${{ steps.filter.outputs.notification }}" == "true" ]] && SVCS+=("notification")
            [[ "${{ steps.filter.outputs.payment }}"     == "true" ]] && SVCS+=("payment")
            [[ "${{ steps.filter.outputs.waitingroom }}" == "true" ]] && SVCS+=("waitingroom")
            [[ "${{ steps.filter.outputs.frontend }}"    == "true" ]] && SVCS+=("frontend")
            if [ ${#SVCS[@]} -eq 0 ]; then
              echo 'services=[]' >> $GITHUB_OUTPUT
            else
              JOINED=$(printf '"%s",' "${SVCS[@]}")
              echo "services=[${JOINED%,}]" >> $GITHUB_OUTPUT
            fi
          fi

  go-ci:
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.go == 'true'"
    uses: ./.github/workflows/template-go.yml

  node-ci:
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.node == 'true'"
    uses: ./.github/workflows/template-node.yml

  python-ci:
    needs: changes
    if: "!startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.python == 'true'"
    uses: ./.github/workflows/template-python.yml

  docker-ci:
    needs: changes
    if: "needs.changes.outputs.docker_services != '[]' && needs.changes.outputs.docker_services != ''"
    uses: ./.github/workflows/template-docker.yml
    with:
      services: ${{ needs.changes.outputs.docker_services }}
    secrets: inherit

  gitleaks:
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: ./.github/workflows/template-gitleaks.yml
