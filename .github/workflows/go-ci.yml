name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "services/auth/**"
      - "services/booking/**"
      - "services/event/**"
      - "services/inventory/**"
      - "services/waitingroom/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/auth/**"
      - "services/booking/**"
      - "services/event/**"
      - "services/inventory/**"
      - "services/waitingroom/**"
      - ".github/workflows/go-ci.yml"

jobs:
  lint-and-build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [auth, booking, event, inventory, waitingroom]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ matrix.service }}-${{ hashFiles(format('services/{0}/go.sum', matrix.service)) }}
          restore-keys: go-build-${{ matrix.service }}-

      - name: Sync dependencies
        working-directory: services/${{ matrix.service }}
        run: go mod tidy

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run --config ../../.golangci.yml ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Enforce coverage threshold (≥ 60%)
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          if [ -z "$TOTAL" ]; then TOTAL=0; fi
          echo "Total coverage: ${TOTAL}%"
          awk -v c="$TOTAL" 'BEGIN { if (c+0 < 60) { print "Coverage " c "% is below the 60% threshold"; exit 1 } }'

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
