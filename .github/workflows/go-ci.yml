name: Go CI

on:
  push:
    branches: [$default-branch]
    paths:
      - "services/auth/**"
      - "services/booking/**"
      - "services/event/**"
      - "services/inventory/**"
      - "services/waitingroom/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches: [$default-branch]
    paths:
      - "services/auth/**"
      - "services/booking/**"
      - "services/event/**"
      - "services/inventory/**"
      - "services/waitingroom/**"
      - ".github/workflows/go-ci.yml"

jobs:
  lint-and-build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, booking, event, inventory, waitingroom]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ matrix.service }}-${{ hashFiles(format('services/{0}/go.sum', matrix.service)) }}
          restore-keys: go-build-${{ matrix.service }}-

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/${{ matrix.service }}

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
