name: Update Staging Version

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  update-staging:
    name: Create PR to staging with new image tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update image.tag in values-staging.yaml
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          sed -i "s/^  tag:.*/  tag: $TAG/" \
            manifest/helm/ticket-booking/values-staging.yaml

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-staging-$TAG"
          git checkout -b "$BRANCH"
          git add manifest/helm/ticket-booking/values-staging.yaml
          git commit -m "chore: update staging image tag to $TAG"
          git push origin "$BRANCH"

          gh pr create \
            --base staging \
            --head "$BRANCH" \
            --title "chore: update staging to $TAG" \
            --body "Auto-generated by tag \`$TAG\`"
