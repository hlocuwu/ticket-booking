name: Update Production Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to deploy (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  update-production:
    name: Create PR to main with new image tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format. Expected: v1.2.3"
            exit 1
          fi

      - name: Update image.tag in values.yaml
        run: |
          sed -i "s/^  tag:.*/  tag: ${{ inputs.version }}/" \
            manifest/helm/ticket-booking/values.yaml

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-prod-${{ inputs.version }}"
          git checkout -b $BRANCH
          git add manifest/helm/ticket-booking/values.yaml
          git commit -m "chore: update production image tag to ${{ inputs.version }}"
          git push origin $BRANCH

          gh pr create \
            --base main \
            --head $BRANCH \
            --title "chore: deploy ${{ inputs.version }} to production" \
            --body "Manual production deploy request for version \`${{ inputs.version }}\`

            Triggered by: @${{ github.actor }}"
