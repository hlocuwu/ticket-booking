# Production overrides — GKE + Cloud SQL + Memorystore
# db.host, redis.host, tls.acmeEmail, externalSecrets.gcpProjectId, externalSecrets.clusterName
# are injected at deploy time via ArgoCD helm parameters (not committed here)

image:
  tag: latest

app:
  publicUrl: "https://ticket.example.com"   # replace with actual domain

payment:
  publicUrl: "https://ticket.example.com/api/payment"

ingress:
  className: nginx
  host: ticket.example.com   # replace with actual domain

replicas:
  auth: 2
  booking: 2
  event: 2
  inventory: 2
  notification: 1
  payment: 2
  waitingroom: 2
  frontend: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

tls:
  enabled: true
  acmeEmail: ""   # injected via ArgoCD parameter

externalSecrets:
  enabled: true
  gcpProjectId: ""        # injected via ArgoCD parameter
  clusterLocation: "asia-southeast1-a"
  clusterName: ""         # injected via ArgoCD parameter
