apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ticket-booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: inventory
spec:
  replicas: {{ .Values.replicas.inventory }}
  selector:
    matchLabels:
      {{- include "ticket-booking.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: inventory
  template:
    metadata:
      labels:
        {{- include "ticket-booking.labels" . | nindent 8 }}
        app.kubernetes.io/component: inventory
    spec:
      {{- include "ticket-booking.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: inventory
          image: "{{ .Values.image.registry }}/{{ .Values.image.owner }}/ticket-booking-inventory:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_USER
              value: {{ .Values.db.user | quote }}
            - name: DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: db-password
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
