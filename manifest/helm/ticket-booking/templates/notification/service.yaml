apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ticket-booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification
spec:
  selector:
    {{- include "ticket-booking.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: notification
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP
      name: http
