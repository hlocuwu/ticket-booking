apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ticket-booking.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification
spec:
  replicas: {{ .Values.replicas.notification }}
  selector:
    matchLabels:
      {{- include "ticket-booking.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notification
  template:
    metadata:
      labels:
        {{- include "ticket-booking.labels" . | nindent 8 }}
        app.kubernetes.io/component: notification
    spec:
      {{- include "ticket-booking.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: notification
          image: "{{ .Values.image.registry }}/{{ .Values.image.owner }}/ticket-booking-notification:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8086
          env:
            - name: PORT
              value: "8086"
            - name: SMTP_SERVER
              value: {{ .Values.smtp.server | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: smtp-username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: smtp-password
            - name: SENDER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ticket-secrets
                  key: sender-email
          livenessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8086
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
