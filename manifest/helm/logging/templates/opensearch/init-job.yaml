apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-init-scripts
  namespace: {{ .Values.namespace }}
data:
  init.sh: |
    #!/bin/sh
    set -e
    OS_URL="http://opensearch.{{ .Values.namespace }}.svc.cluster.local:9200"
    OSD_URL="http://opensearch-dashboards.{{ .Values.namespace }}.svc.cluster.local:5601"
    OS_CRED="admin:${OS_PASS:-admin}"

    echo "Waiting for OpenSearch..."
    until curl -sf -u "$OS_CRED" "$OS_URL/_cluster/health" > /dev/null; do sleep 5; done

    echo "Waiting for OpenSearch Dashboards..."
    until curl -sf "$OSD_URL/api/status" > /dev/null 2>&1; do sleep 5; done
    sleep 10

    echo "Creating index template for parsed fields..."
    curl -sf -u "$OS_CRED" -X PUT "$OS_URL/_index_template/ticket-booking-logs" \
      -H 'Content-Type: application/json' -d '{
        "index_patterns": ["ticket-booking-logs-*"],
        "template": {
          "mappings": {
            "properties": {
              "@timestamp":   { "type": "date" },
              "environment":  { "type": "keyword" },
              "http_status":  { "type": "integer" },
              "http_method":  { "type": "keyword" },
              "http_path":    { "type": "keyword" },
              "latency_ms":   { "type": "float" },
              "log":          { "type": "text" },
              "stream":       { "type": "keyword" }
            }
          }
        }
      }'

    echo "Creating index pattern..."
    curl -sf -X POST "$OSD_URL/api/saved_objects/index-pattern/ticket-booking-logs" \
      -H 'Content-Type: application/json' \
      -H 'osd-xsrf: true' \
      -d '{
        "attributes": {
          "title": "ticket-booking-logs-*",
          "timeFieldName": "@timestamp"
        }
      }' || true

    echo "Creating dashboard saved objects..."
    curl -sf -X POST "$OSD_URL/api/saved_objects/_import?overwrite=true" \
      -H 'osd-xsrf: true' \
      -F 'file=@/scripts/dashboard.ndjson' || true

    echo "Creating cicd-metrics index template..."
    curl -sf -u "$OS_CRED" -X PUT "$OS_URL/_index_template/cicd-metrics" \
      -H 'Content-Type: application/json' -d '{
        "index_patterns": ["cicd-metrics"],
        "template": {
          "mappings": {
            "properties": {
              "@timestamp":       { "type": "date" },
              "run_id":           { "type": "long" },
              "run_number":       { "type": "integer" },
              "workflow_name":    { "type": "keyword" },
              "event":            { "type": "keyword" },
              "action":           { "type": "keyword" },
              "status":           { "type": "keyword" },
              "conclusion":       { "type": "keyword" },
              "branch":           { "type": "keyword" },
              "actor":            { "type": "keyword" },
              "duration_seconds": { "type": "float" },
              "html_url":         { "type": "keyword" },
              "created_at":       { "type": "date" },
              "updated_at":       { "type": "date" }
            }
          }
        }
      }'

    echo "Creating cicd-metrics index pattern..."
    curl -sf -X POST "$OSD_URL/api/saved_objects/index-pattern/cicd-metrics" \
      -H 'Content-Type: application/json' \
      -H 'osd-xsrf: true' \
      -d '{"attributes":{"title":"cicd-metrics","timeFieldName":"created_at"}}' || true

    echo "Creating cicd dashboard saved objects..."
    curl -sf -X POST "$OSD_URL/api/saved_objects/_import?overwrite=true" \
      -H 'osd-xsrf: true' \
      -F 'file=@/scripts/cicd-dashboard.ndjson' || true

    echo "Init complete."

  dashboard.ndjson: |
