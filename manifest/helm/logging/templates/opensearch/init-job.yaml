apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-init-scripts
  namespace: {{ .Values.namespace }}
data:
  init.sh: |
    #!/bin/sh
    set -e
    OS_URL="http://opensearch.{{ .Values.namespace }}.svc.cluster.local:9200"
    OSD_URL="http://opensearch-dashboards.{{ .Values.namespace }}.svc.cluster.local:5601"

    echo "Waiting for OpenSearch..."
    until curl -sf -u admin:admin "$OS_URL/_cluster/health" > /dev/null; do sleep 5; done

    echo "Waiting for OpenSearch Dashboards..."
    until curl -sf "$OSD_URL/api/status" > /dev/null 2>&1; do sleep 5; done
    sleep 10

    echo "Creating index template for parsed fields..."
    curl -sf -u admin:admin -X PUT "$OS_URL/_index_template/ticket-booking-logs" \
      -H 'Content-Type: application/json' -d '{
        "index_patterns": ["ticket-booking-logs-*"],
        "template": {
          "mappings": {
            "properties": {
              "@timestamp":   { "type": "date" },
              "environment":  { "type": "keyword" },
              "http_status":  { "type": "integer" },
              "http_method":  { "type": "keyword" },
              "http_path":    { "type": "keyword" },
              "latency_ms":   { "type": "float" },
              "log":          { "type": "text" },
              "stream":       { "type": "keyword" }
            }
          }
        }
      }'

    echo "Creating index pattern..."
    curl -sf -X POST "$OSD_URL/api/saved_objects/index-pattern/ticket-booking-logs" \
      -H 'Content-Type: application/json' \
      -H 'osd-xsrf: true' \
      -d '{
        "attributes": {
          "title": "ticket-booking-logs-*",
          "timeFieldName": "@timestamp"
        }
      }' || true

    echo "Creating dashboard saved objects..."
    curl -sf -X POST "$OSD_URL/api/saved_objects/_import?overwrite=true" \
      -H 'osd-xsrf: true' \
      -F 'file=@/scripts/dashboard.ndjson' || true

    echo "Init complete."

  dashboard.ndjson: |
    {"type":"visualization","id":"viz-total-requests","attributes":{"title":"Total Requests","visState":"{\"title\":\"Total Requests\",\"type\":\"metric\",\"params\":{\"addTooltip\":true,\"addLegend\":false,\"type\":\"gauge\",\"gauge\":{\"verticalSplit\":false,\"extendRange\":true,\"percentageMode\":false,\"gaugeType\":\"Metric\",\"gaugeStyle\":\"Full\",\"backStyle\":\"Full\",\"orientation\":\"vertical\",\"colorSchema\":\"Green to Red\",\"gaugeColorMode\":\"None\",\"colorsRange\":[{\"from\":0,\"to\":10000}],\"invertColors\":false,\"labels\":{\"show\":true,\"color\":\"black\"},\"scale\":{\"show\":false,\"labels\":false,\"color\":\"#333\"},\"type\":\"simple\",\"style\":{\"bgWidth\":0.9,\"bgMask\":false,\"mask\":false,\"maskWidth\":0.3,\"bgFill\":\"#eee\",\"bgColor\":false,\"subText\":\"\",\"fontSize\":60,\"labelColor\":true}}},\"aggs\":[{\"id\":\"1\",\"enabled\":true,\"type\":\"count\",\"schema\":\"metric\",\"params\":{}}]}","uiStateJSON":"{}","description":"Total HTTP requests","kibanaSavedObjectMeta":{"searchSourceJSON":"{\"index\":\"ticket-booking-logs\",\"query\":{\"query\":\"http_status:*\",\"language\":\"kuery\"},\"filter\":[]}"}},"references":[{"id":"ticket-booking-logs","name":"kibanaSavedObjectMeta.searchSourceJSON.index","type":"index-pattern"}]}
    {"type":"visualization","id":"viz-error-requests","attributes":{"title":"Error Requests (4xx/5xx)","visState":"{\"title\":\"Error Requests (4xx/5xx)\",\"type\":\"metric\",\"params\":{\"addTooltip\":true,\"addLegend\":false,\"type\":\"gauge\",\"gauge\":{\"verticalSplit\":false,\"extendRange\":true,\"percentageMode\":false,\"gaugeType\":\"Metric\",\"gaugeStyle\":\"Full\",\"backStyle\":\"Full\",\"orientation\":\"vertical\",\"colorSchema\":\"Green to Red\",\"gaugeColorMode\":\"Labels\",\"colorsRange\":[{\"from\":0,\"to\":1},{\"from\":1,\"to\":100},{\"from\":100,\"to\":10000}],\"invertColors\":false,\"labels\":{\"show\":true,\"color\":\"black\"},\"scale\":{\"show\":false,\"labels\":false,\"color\":\"#333\"},\"type\":\"simple\",\"style\":{\"bgWidth\":0.9,\"bgMask\":false,\"mask\":false,\"maskWidth\":0.3,\"bgFill\":\"#eee\",\"bgColor\":false,\"subText\":\"\",\"fontSize\":60,\"labelColor\":true}}},\"aggs\":[{\"id\":\"1\",\"enabled\":true,\"type\":\"count\",\"schema\":\"metric\",\"params\":{}}]}","uiStateJSON":"{}","description":"4xx and 5xx error count","kibanaSavedObjectMeta":{"searchSourceJSON":"{\"index\":\"ticket-booking-logs\",\"query\":{\"query\":\"http_status >= 400\",\"language\":\"kuery\"},\"filter\":[]}"}},"references":[{"id":"ticket-booking-logs","name":"kibanaSavedObjectMeta.searchSourceJSON.index","type":"index-pattern"}]}
