apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensearch-dashboards
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.opensearchDashboards.ingress.className }}
  rules:
    - host: {{ .Values.opensearchDashboards.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opensearch-dashboards
                port:
                  number: 5601
