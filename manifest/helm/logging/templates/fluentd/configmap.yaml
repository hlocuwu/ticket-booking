apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: {{ .Values.namespace }}
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type multi_format
        <pattern>
          format json
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%NZ
        </pattern>
        <pattern>
          format /^(?<time>.+) (?<stream>stdout|stderr) [^ ]* (?<log>.*)$/
          time_format %Y-%m-%dT%H:%M:%S.%N%:z
        </pattern>
      </parse>
    </source>

    <filter kubernetes.**>
      @type kubernetes_metadata
    </filter>

    <filter kubernetes.**>
      @type record_transformer
      enable_ruby true
      <record>
        environment ${
          case record.dig('kubernetes', 'namespace_name').to_s
          when 'ticket-booking' then 'production'
          when 'ticket-booking-staging' then 'staging'
          else nil
          end
        }
        http_status ${
          m = record['log'].to_s.match(/^\[GIN\].*\|\s*(\d{3})\s*\|/)
          m ? m[1].to_i : nil
        }
        http_method ${
          m = record['log'].to_s.match(/\|\s*([A-Z]+)\s+"[^"]+"/)
          m ? m[1] : nil
        }
        http_path ${
          m = record['log'].to_s.match(/\|\s*[A-Z]+\s+"([^"]+)"/)
          m ? m[1] : nil
        }
        latency_ms ${
          log = record['log'].to_s
          m = log.match(/\|\s*([\d.]+)(ms|s|ns)\s*\|/)
          m2 = log.match(/\|\s*([\d.]+)\xC2\xB5s\s*\|/)
          if m
            val = m[1].to_f
            m[2] == 's' ? (val * 1000).round(3) : (m[2] == 'ns' ? (val / 1_000_000.0).round(6) : val.round(3))
          elsif m2
            (m2[1].to_f / 1000.0).round(6)
          else
            nil
          end
        }
      </record>
    </filter>

    <match kubernetes.**>
      @type opensearch
      host opensearch.{{ .Values.namespace }}.svc.cluster.local
      port 9200
      logstash_format true
      logstash_prefix ticket-booking-logs
      include_tag_key true
      tag_key @log_name
      <buffer>
        @type file
        path /var/log/fluentd-buffers/kubernetes.system.buffer
        flush_mode interval
        flush_interval 5s
        retry_type exponential_backoff
        retry_max_interval 30
        overflow_action block
      </buffer>
    </match>
