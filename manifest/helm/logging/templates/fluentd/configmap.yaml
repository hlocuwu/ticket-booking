apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: {{ .Values.namespace }}
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type multi_format
        <pattern>
          format json
          time_key time
          time_format %Y-%m-%dT%H:%M:%S.%NZ
        </pattern>
        <pattern>
          format /^(?<time>.+) (?<stream>stdout|stderr) [^ ]* (?<log>.*)$/
          time_format %Y-%m-%dT%H:%M:%S.%N%:z
        </pattern>
      </parse>
    </source>

    <filter kubernetes.**>
      @type kubernetes_metadata
    </filter>

    <filter kubernetes.**>
      @type record_transformer
      enable_ruby true
      <record>
        environment ${ ns = record.dig('kubernetes', 'namespace_name').to_s; ns == 'ticket-booking' ? 'production' : (ns == 'ticket-booking-staging' ? 'staging' : nil) }
        http_status ${ m = record['log'].to_s.match(/^\[GIN\].*\|\s*(\d{3})\s*\|/); m ? m[1].to_i : nil }
        http_method ${ m = record['log'].to_s.match(/\|\s*([A-Z]+)\s+"[^"]+"/); m ? m[1] : nil }
        http_path ${ m = record['log'].to_s.match(/\|\s*[A-Z]+\s+"([^"]+)"/); m ? m[1] : nil }
        latency_ms ${ m = record['log'].to_s.match(/\|\s*([\d.]+)(ms|s|ns)\s*\|/); m ? (m[2]=='s' ? (m[1].to_f*1000).round(3) : m[1].to_f.round(3)) : nil }
      </record>
    </filter>

    <match kubernetes.**>
      @type opensearch
      host opensearch.{{ .Values.namespace }}.svc.cluster.local
      port 9200
      logstash_format true
      logstash_prefix ticket-booking-logs
      include_tag_key true
      tag_key @log_name
      bulk_message_request_threshold 10mb
      <buffer>
        @type file
        path /var/log/fluentd-buffers/kubernetes.system.buffer
        flush_mode interval
        flush_interval 10s
        retry_type exponential_backoff
        retry_max_interval 60
        overflow_action block
        chunk_limit_size 8mb
        total_limit_size 512mb
      </buffer>
    </match>
