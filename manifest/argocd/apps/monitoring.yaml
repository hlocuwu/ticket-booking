apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hlocuwu/ticket-booking.git
    targetRevision: HEAD
    path: manifest/helm/monitoring
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: grafana.ingress.host
          value: grafana.flashticket.site
        - name: tls.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
