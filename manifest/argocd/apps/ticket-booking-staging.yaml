apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticket-booking-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hlocuwu/ticket-booking.git
    targetRevision: staging
    path: manifest/helm/ticket-booking
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
      parameters:
        - name: db.host
          value: "10.81.97.3"
        - name: redis.host
          value: "10.81.96.3"
        - name: externalSecrets.enabled
          value: "true"
        - name: externalSecrets.createClusterStore
          value: "false"
        - name: externalSecrets.gcpProjectId
          value: "ticket-booking-cloud"
        - name: externalSecrets.clusterName
          value: "ticket-booking-cloud-gke"
        - name: tls.enabled
          value: "true"
        - name: tls.acmeEmail
          value: "nhloc08@gmail.com"
        - name: ingress.host
          value: "staging.flashticket.site"
  destination:
    server: https://kubernetes.default.svc
    namespace: ticket-booking-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
