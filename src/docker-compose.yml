networks:
  ticket-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  # ---------------------------------------
  # Databases & Caches
  # ---------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ticket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-ticket_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-ticket_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticket_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------
  # Microservices
  # ---------------------------------------
  inventory:
    build:
      context: ./services/inventory
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_USERNAME}/ticket-booking-inventory:latest
    container_name: ticket_inventory_service
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=ticket_postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-ticket_db}
      - PORT=8080
    networks:
      - ticket-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  waitingroom:
    build:
      context: ./services/waitingroom
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_USERNAME}/ticket-booking-waitingroom:latest
    container_name: ticket_waitingroom_service
    restart: on-failure
    ports:
      - "8082:8080"
    environment:
      - REDIS_HOST=ticket_redis
      - PORT=8080
    networks:
      - ticket-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  booking:
    build:
      context: ./services/booking
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_USERNAME}/ticket-booking-booking:latest
    container_name: ticket_booking_service
    restart: on-failure
    ports:
      - "8083:8080"
    environment:
      - INVENTORY_URL=http://ticket_inventory_service:8080
      - WAITINGROOM_URL=http://ticket_waitingroom_service:8080
      - AUTH_URL=http://ticket_auth_service:8080
      - PAYMENT_URL=http://ticket_payment_service:8080
      - NOTIFICATION_URL=http://ticket_notification_service:8086
      - REDIS_HOST=ticket_redis:6379
      - APP_PUBLIC_URL=${APP_PUBLIC_URL}
      - PORT=8080
    networks:
      - ticket-network
    depends_on:
      inventory:
        condition: service_healthy
      waitingroom:
        condition: service_healthy
      auth:
        condition: service_healthy
      payment:
        condition: service_healthy
      notification:
        condition: service_healthy

  event:
    build:
      context: ./services/event
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_USERNAME}/ticket-booking-event:latest
    container_name: ticket_event_service
    restart: on-failure
    ports:
      - "8084:8080"
    environment:
      - DB_HOST=ticket_postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-ticket_db}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8080
    networks:
      - ticket-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  notification:
    build:
      context: ./services/notification
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_USERNAME}/ticket-booking-notification:latest
    container_name: ticket_notification_service
    restart: on-failure
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SENDER_EMAIL=${SENDER_EMAIL}
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8086/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_USERNAME}/ticket-booking-auth:latest
    container_name: ticket_auth_service
    restart: on-failure
    ports:
      - "8085:8080"
    environment:
      - DB_HOST=ticket_postgres
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-ticket_db}
      - REDIS_HOST=ticket_redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - NOTIFICATION_URL=http://ticket_notification_service:8086
      - PORT=8080
    networks:
      - ticket-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  payment:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_USERNAME}/ticket-booking-payment:latest
    container_name: ticket_payment_service
    restart: on-failure
    ports:
      - "8087:8080"
    environment:
      - PORT=8080
      - PAYMENT_PUBLIC_URL=${PAYMENT_PUBLIC_URL}
      - MOMO_PARTNER_CODE=${MOMO_PARTNER_CODE:-MOMO}
      - MOMO_ACCESS_KEY=${MOMO_ACCESS_KEY}
      - MOMO_SECRET_KEY=${MOMO_SECRET_KEY}
      - MOMO_ENDPOINT=${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_USERNAME}/ticket-booking-frontend:latest
    container_name: ticket_frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - ticket-network
    depends_on:
      auth:
        condition: service_healthy
      event:
        condition: service_healthy
      waitingroom:
        condition: service_healthy
      booking:
        condition: service_started
      payment:
        condition: service_healthy