server {
    listen 80;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"                              always;
    add_header X-Content-Type-Options    "nosniff"                                 always;
    add_header X-XSS-Protection          "1; mode=block"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"         always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:;"
        always;

    # Serve the React static files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Route /api/auth traffic to the Auth service
    location /api/auth/ {
        proxy_pass http://ticket_auth_service:8080/;
        proxy_set_header Host $host;
    }

    # Route /api/events traffic to the Event service
    location /api/events/ {
        proxy_pass http://ticket_event_service:8080/;
        proxy_set_header Host $host;
    }

    # Route /api/queue traffic to the Waiting Room service
    location /api/queue/ {
        proxy_pass http://ticket_waitingroom_service:8080/;
        proxy_set_header Host $host;
    }

    # Route /api/booking traffic to the Booking orchestrator
    location /api/booking/ {
        proxy_pass http://ticket_booking_service:8080/;
        proxy_set_header Host $host;
    }

    # Route /api/notification traffic to the Notification orchestrator
    location /api/notification/ {
        proxy_pass http://ticket_notification_service:8086/;
        proxy_set_header Host $host;
    }

    # Route /api/inventory traffic to the Inventory orchestrator
    location /api/inventory/ {
        proxy_pass http://ticket_inventory_service:8080/;
        proxy_set_header Host $host;
    }

    # Route /api/payment traffic to the Payment service
    location /api/payment/ {
        proxy_pass http://ticket_payment_service:8080/;
        proxy_set_header Host $host;
    }
}
