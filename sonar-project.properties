sonar.projectKey=hlocuwu_ticket-booking
sonar.organization=hlocuwu

sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,\
  **/.git/**,\
  **/dist/**,\
  **/vendor/**,\
  services/*/coverage.out,\
  services/notification/tests/**

sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go,\
  services/notification/tests/**,\
  services/payment/tests/**,\
  frontend/src/tests/**

# Go coverage
sonar.go.coverage.reportPaths=\
  services/auth/coverage.out,\
  services/booking/coverage.out,\
  services/event/coverage.out,\
  services/inventory/coverage.out,\
  services/waitingroom/coverage.out

# Python coverage
sonar.python.version=3.10
sonar.python.coverage.reportPaths=services/notification/coverage.xml

# JavaScript/Node coverage
sonar.javascript.lcov.reportPaths=\
  services/payment/coverage/lcov.info,\
  frontend/coverage/lcov.info
